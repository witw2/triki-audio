# Push a tag like v1.0.0 -> builds TrikiAudio.exe on Windows, self-tests it and attaches
# TrikiAudio-windows.zip to a GitHub release. Can also be started by hand (Actions tab).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and self-test
        shell: pwsh
        run: ./build.ps1
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: TrikiAudio-windows
          path: dist/TrikiAudio-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrikiAudio-windows.zip
          generate_release_notes: true
